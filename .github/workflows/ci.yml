name: "🧪 CI"
run-name: "🧪 Validar código · ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
    branches:
      - develop
      - release
      - "release/**"
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  detect_ci_scope:
    name: "🔎 00 · Detectar escopo do PR"
    runs-on: ubuntu-latest
    outputs:
      ci_required: ${{ steps.detect.outputs.ci_required }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🔍 02 · Analisar arquivos alterados"
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ci_required=false
          changed_files="$(mktemp)"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"

          if [ ! -s "$changed_files" ]; then
            echo "Nenhum arquivo alterado encontrado. Executando a CI completa por segurança."
            ci_required=true
          else
            echo "Arquivos alterados:"
            cat "$changed_files"

            while IFS= read -r file; do
              case "$file" in
                *.md)
                  ;;
                *)
                  ci_required=true
                  break
                  ;;
              esac
            done < "$changed_files"
          fi

          echo "ci_required=$ci_required" >> "$GITHUB_OUTPUT"
          echo "CI necessária: $ci_required"

  validate_git_flow:
    name: "🔀 01 · Validar fluxo de branches"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Conferir estrutura do repositório"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "📁 Bloquear pastas extras e diretórios de scripts"
        run: |
          node <<'VALIDAR_ESTRUTURA'
          const cp = require('node:child_process');
          const nomes = args => cp.execFileSync('git', args, { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          const assert = require('node:assert/strict');
          // Estrutura aprovada do projeto, válida também em promoções para branches antigas.
          const raizes = new Set([".agents", ".github", "docs", "infra", "k8s", "src", "tests"]);
          function foraDoPadrao(arquivos) {
            return arquivos.filter(nome => {
              const pastas = nome.split('/').slice(0, -1);
              return pastas.some(pasta => pasta.toLowerCase() === 'scripts') || (pastas.length > 0 && !raizes.has(pastas[0]));
            });
          }
          assert.deepEqual(foraDoPadrao(['src/Caso/Novo.cs']), []);
          assert.deepEqual(foraDoPadrao(['scripts/local.ps1', '.github/scripts/check.cjs', 'pasta-extra/arquivo']), ['scripts/local.ps1', '.github/scripts/check.cjs', 'pasta-extra/arquivo']);
          const invalidos = foraDoPadrao(nomes(['ls-files']));
          if (invalidos.length) throw new Error('Estrutura fora do padrão aprovado: ' + invalidos.join(', '));
          console.log('Estrutura existente preservada; nenhuma pasta de scripts versionada.');
          VALIDAR_ESTRUTURA

      - name: "🔀 01 · Conferir origem e destino do PR"
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Branch de destino: $BASE_BRANCH"
          echo "Branch de origem: $HEAD_BRANCH"

          case "$BASE_BRANCH" in
            develop)
              case "$HEAD_BRANCH" in
                main|release|release/*)
                  echo "Branches protegidas de estágio não podem abrir PR de retorno para develop."
                  exit 1
                  ;;
                *)
                  echo "PR para develop segue a entrada do Git Flow."
                  ;;
              esac
              ;;

            release|release/*)
              if [ "$HEAD_BRANCH" != "develop" ]; then
                echo "PRs para release devem vir de develop."
                exit 1
              fi

              echo "PR para release segue a promoção do Git Flow."
              ;;

            main)
              case "$HEAD_BRANCH" in
                release|release/*)
                  echo "PR para main segue a promoção do Git Flow."
                  ;;
                *)
                  echo "PRs para main devem vir de release ou release/*."
                  exit 1
                  ;;
              esac
              ;;

            *)
              echo "Branch protegida de destino não suportada: $BASE_BRANCH"
              exit 1
              ;;
          esac

  build_application:
    name: "🏗️ 02 · Build da aplicação"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar SDK do .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "📦 03 · Restaurar cache de pacotes NuGet"
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "📚 04 · Resolver dependências do projeto (dotnet restore)"
        run: dotnet restore OficinaMecanica.OrcamentoPagamento.sln

      - name: "🔨 05 · Compilar a solução"
        run: dotnet build OficinaMecanica.OrcamentoPagamento.sln --configuration Release --no-restore

  verify_code_style:
    name: "🎨 03 · Verificar padrão de código"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar SDK do .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "📚 03 · Resolver dependências do projeto (dotnet restore)"
        run: dotnet restore OficinaMecanica.OrcamentoPagamento.sln

      - name: "✅ 04 · Verificar formatação do código"
        run: dotnet format OficinaMecanica.OrcamentoPagamento.sln --verify-no-changes --no-restore

  test_application:
    name: "🧪 04 · Testar aplicação"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar SDK do .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "📦 03 · Restaurar cache de pacotes NuGet"
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "📚 04 · Resolver dependências do projeto (dotnet restore)"
        run: dotnet restore OficinaMecanica.OrcamentoPagamento.sln

      - name: "🔨 05 · Compilar a solução"
        run: dotnet build OficinaMecanica.OrcamentoPagamento.sln --configuration Release --no-restore

      - name: "🧪 06 · Executar testes com cobertura"
        run: >
          dotnet test OficinaMecanica.OrcamentoPagamento.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --settings tests/sonarqube.runsettings
          --results-directory ./TestResults
          --logger "trx"

      - name: "🔍 07 · Validar resultados dos testes"
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Path TestResults -Recurse -Filter *.trx

          if (-not $trxFiles) {
            throw "Nenhum arquivo TRX foi gerado."
          }

          $total = 0
          $passed = 0
          $failed = 0
          $skipped = 0

          foreach ($trxFile in $trxFiles) {
            [xml]$trx = Get-Content -LiteralPath $trxFile.FullName
            $counters = $trx.TestRun.ResultSummary.Counters

            $total += [int]$counters.total
            $passed += [int]$counters.passed
            $failed += [int]$counters.failed
            $skipped += [int]$counters.notExecuted
          }

          Write-Host "Tests: total=$total passed=$passed failed=$failed skipped=$skipped"

          if ($total -eq 0) {
            throw "Nenhum teste foi executado."
          }

          if ($failed -gt 0) {
            throw "Existem testes com falha."
          }

          if ($skipped -gt 0) {
            throw "A CI exige zero testes ignorados. Confira o Docker antes de coletar cobertura."
          }

      - name: "📊 08 · Gerar relatório de cobertura"
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;MarkdownSummaryGithub"

      - name: "📈 09 · Validar limite mínimo de cobertura"
        shell: pwsh
        run: |
          [xml]$coverage = Get-Content -LiteralPath TestResults/CoverageReport/Cobertura.xml
          $lineRate = [double]::Parse($coverage.coverage.'line-rate', [System.Globalization.CultureInfo]::InvariantCulture)
          $lineCoverage = [math]::Round($lineRate * 100, 2)

          Write-Host "Line coverage: $lineCoverage%"

          if ($lineCoverage -lt 90) {
            throw "Line coverage $lineCoverage% is below the required 90% threshold."
          }

      - name: "⬆️ 10 · Publicar artefatos de teste e cobertura"
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
            TestResults/CoverageReport/**
          if-no-files-found: error

  build_container_image:
    name: "🐳 05 · Build da imagem Docker"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Configurar Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "🔨 03 · Compilar imagem Docker"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: oficina-mecanica-orcamento-pagamento:ci
          outputs: type=docker,dest=${{ runner.temp }}/orcamento-pagamento-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "🧾 04 · Identificar o conteúdo validado"
        run: git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/source-tree.txt"

      - name: "⬆️ 05 · Publicar imagem para o CD"
        if: github.base_ref == 'develop'
        uses: actions/upload-artifact@v7
        with:
          name: orcamento-pagamento-image-pr-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/orcamento-pagamento-image.tar
            ${{ runner.temp }}/source-tree.txt
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  validate_terraform:
    name: "🌐 05.1 · Validar infraestrutura de mensageria"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    env:
      TF_WORKING_DIRECTORY: infra/terraform/environments/dev
    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: "🧪 03 · Testar os guardrails reais sem AWS"
        run: |
          node <<'PREPARAR_TESTES_MENSAGERIA'
          const fs = require('node:fs'), path = require('node:path');
          const origem = fs.readFileSync('.github/workflows/aws-deploy.yml', 'utf8').replace(/\r\n/g, '\n');
          const bloco = origem.match(/          cat > "\u0024RUNNER_TEMP\/mensageria-orcamento.cjs" <<'VALIDAR_MENSAGERIA'\n([\s\S]*?)          VALIDAR_MENSAGERIA/);
          if (!bloco) throw new Error('Validações reais da mensageria ausentes.');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'mensageria-orcamento.cjs'), bloco[1].split('\n').map(l => l.slice(10)).join('\n'));
          PREPARAR_TESTES_MENSAGERIA
          cat > "$RUNNER_TEMP/mensageria-orcamento.test.cjs" <<'TESTE_MENSAGERIA'
          const { test } = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const cp = require('node:child_process');
          const h = require('./mensageria-orcamento.cjs');
          const conta = '123456789012', regiao = 'us-east-1', ambiente = 'development';
          const n = h.nomes(ambiente);
          const c = {
            entrada_queue_url: 'https://sqs.us-east-1.amazonaws.com/' + conta + '/' + n.fila + '.fifo',
            entrada_queue_arn: 'arn:aws:sqs:us-east-1:' + conta + ':' + n.fila + '.fifo',
            dlq_url: 'https://sqs.us-east-1.amazonaws.com/' + conta + '/' + n.fila + '-dlq.fifo',
            dlq_arn: 'arn:aws:sqs:us-east-1:' + conta + ':' + n.fila + '-dlq.fifo'
          };
          function state() {
            return { resources: [
              { mode: 'managed', type: 'aws_sqs_queue', name: 'orcamento_pagamento_entrada', instances: [{ attributes: { id: c.entrada_queue_url, arn: c.entrada_queue_arn } }] },
              { mode: 'managed', type: 'aws_sqs_queue', name: 'orcamento_pagamento_dlq', instances: [{ attributes: { id: c.dlq_url, arn: c.dlq_arn } }] },
              { mode: 'managed', type: 'aws_sqs_queue_redrive_allow_policy', name: 'orcamento_pagamento_dlq', instances: [{ attributes: { queue_url: c.dlq_url } }] },
              { mode: 'managed', type: 'aws_ssm_parameter', name: 'orcamento_pagamento_mensageria', instances: Object.keys(c).map(k => ({ attributes: { name: n.prefixo + '/' + k, arn: 'arn:aws:ssm:' + regiao + ':' + conta + ':parameter' + n.prefixo + '/' + k } })) }
            ] };
          }
          const vazio = () => null;
          function awsInfra(...args) {
            if (args[0] === 'ssm') {
              const nome = args[args.indexOf('--name') + 1];
              return { Parameter: { Type: 'String', Value: nome === n.status ? 'ready' : c[nome.split('/').pop()] } };
            }
            const dlq = args.includes(c.dlq_url);
            return { Attributes: {
              QueueArn: dlq ? c.dlq_arn : c.entrada_queue_arn, FifoQueue: 'true', ContentBasedDeduplication: 'false', SqsManagedSseEnabled: 'true',
              MessageRetentionPeriod: dlq ? '1209600' : '345600', VisibilityTimeout: '60', ReceiveMessageWaitTimeSeconds: '20',
              RedrivePolicy: JSON.stringify({ maxReceiveCount: 5, deadLetterTargetArn: c.dlq_arn }),
              RedriveAllowPolicy: JSON.stringify({ redrivePermission: 'byQueue', sourceQueueArns: [c.entrada_queue_arn] })
            } };
          }
          test('state preserva conta, região, owner e nomes dos recursos', () => {
            h.validarState(state(), conta, regiao, ambiente);
            assert.deepEqual(h.contratos(state()), c);
            for (const outraConta of ['000000000000', 'outra']) assert.throws(() => h.validarState(state(), outraConta, regiao, ambiente));
            assert.throws(() => h.validarState(state(), conta, 'us-west-2', ambiente));
            assert.throws(() => h.nomes('production'));
            for (const alterar of [s => s.resources[0].name = 'outro_owner', s => s.resources[0].type = 'aws_db_instance', s => s.resources[0].mode = 'data', s => s.resources[0].module = 'module.outra', s => s.resources[3].instances[0].attributes.name = '/segredo/outro']) {
              const s = state(); alterar(s); assert.throws(() => h.validarState(s, conta, regiao, ambiente));
            }
            assert.throws(() => h.validarState({}, conta, regiao, ambiente));
          });
          test('bootstrap só aceita inventário vazio do owner e respostas válidas', () => {
            const aws = (...args) => args[1] === 'describe-parameters' ? { Parameters: [] } : null;
            h.verificarVazio(ambiente, aws);
            assert.throws(() => h.verificarVazio(ambiente, () => ({ QueueUrl: c.entrada_queue_url })));
            assert.throws(() => h.verificarVazio(ambiente, (...a) => a[1] === 'describe-parameters' ? {} : null));
            assert.throws(() => h.verificarVazio(ambiente, (...a) => a[1] === 'describe-parameters' ? { Parameters: [{ Name: n.prefixo + '/entrada_queue_url' }] } : null));
            assert.throws(() => h.verificarVazio(ambiente, (...a) => a.includes(n.status) ? { Parameter: {} } : aws(...a)));
          });
          test('ausência exige código específico, nunca AccessDenied ou erro de rede', () => {
            assert.equal(h.ausente(['sqs'], { stderr: '(QueueDoesNotExist)' }), true);
            assert.equal(h.ausente(['ssm'], { stderr: '(ParameterNotFound)' }), true);
            for (const stderr of ['AccessDenied', 'ExpiredToken', 'timeout', '(ParameterNotFound)']) assert.equal(h.ausente(['sqs'], { stderr }), false);
          });
          test('destroy exige produtor removido e filas sem mensagens de qualquer categoria', () => {
            const aws = (...args) => args[0] === 'ssm' ? null : { Attributes: { ApproximateNumberOfMessages: '0', ApproximateNumberOfMessagesNotVisible: '0', ApproximateNumberOfMessagesDelayed: '0' } };
            h.pendencias(c, ambiente, aws);
            h.pendencias(c, ambiente, vazio);
            assert.throws(() => h.pendencias(c, ambiente, () => ({ Parameter: { Value: 'ready' } })));
            for (const campo of ['ApproximateNumberOfMessages', 'ApproximateNumberOfMessagesNotVisible', 'ApproximateNumberOfMessagesDelayed']) {
              for (const valor of ['1', '-1', '', undefined, 0, 'não-numérico']) {
                assert.throws(() => h.pendencias(c, ambiente, (...args) => args[0] === 'ssm' ? null : { Attributes: { ...aws(...args).Attributes, [campo]: valor } }));
              }
            }
            assert.throws(() => h.pendencias({ ...c, dlq_url: '' }, ambiente, aws));
          });
          test('após apply confere FIFO, SSE, redrive e todos os contratos SSM', () => {
            h.verificarInfra(c, ambiente, awsInfra);
            for (const alterar of [a => a.FifoQueue = 'false', a => a.SqsManagedSseEnabled = 'false', a => a.VisibilityTimeout = '1', a => a.RedrivePolicy = '{}', a => a.RedriveAllowPolicy = '{}', a => a.QueueArn = 'arn-outro']) {
              assert.throws(() => h.verificarInfra(c, ambiente, (...args) => {
                const r = awsInfra(...args); if (r.Attributes) alterar(r.Attributes); return r;
              }));
            }
            for (const campo of ['Type', 'Value']) assert.throws(() => h.verificarInfra(c, ambiente, (...args) => {
              const r = awsInfra(...args); if (r.Parameter) r.Parameter[campo] = 'divergente'; return r;
            }));
          });
          test('remoção confirma filas e SSM; falha de consulta continua bloqueando', () => {
            h.verificarRemocao(c, ambiente, vazio);
            assert.throws(() => h.verificarRemocao(c, ambiente, () => ({})));
            assert.throws(() => h.verificarRemocao(c, ambiente, () => { throw Error('AccessDenied'); }));
          });
          test('plano proíbe outros owners, substituição no apply e criação no destroy', () => {
            const plano = acoes => ({ format_version: '1.2', planned_values: {}, resource_changes: [{ mode: 'managed', type: 'aws_sqs_queue', change: { actions: acoes } }] });
            h.validarPlano(plano(['create']), 'apply');
            h.validarPlano(plano(['update']), 'apply');
            h.validarPlano(plano(['delete']), 'destroy');
            h.validarPlano({ format_version: '1.2', planned_values: {} }, 'destroy');
            for (const acoes of [[], ['create'], ['update'], ['delete', 'create'], ['forget']]) assert.throws(() => h.validarPlano(plano(acoes), 'destroy'));
            for (const acoes of [['delete'], ['delete', 'create'], []]) assert.throws(() => h.validarPlano(plano(acoes), 'apply'));
            const outro = plano(['create']); outro.resource_changes[0].type = 'aws_iam_role'; assert.throws(() => h.validarPlano(outro, 'apply'));
            assert.throws(() => h.validarPlano({}, 'apply'));
          });
          const deploy = fs.readFileSync('.github/workflows/aws-deploy.yml', 'utf8').replace(/\r\n/g, '\n');
          const cd = fs.readFileSync('.github/workflows/cd-development.yml', 'utf8');
          const bash = process.platform === 'win32' ? 'C:/Program Files/Git/bin/bash.exe' : 'bash';
          test('barreira real bloqueia flags, refs e ambientes indevidos antes de AWS', () => {
            const bloco = deploy.match(/      - name: "🛡️ Conferir habilitação do deploy AWS"\n([\s\S]*?)(?=      - name:)/)[1];
            const gates = [...deploy.matchAll(/      - name: "🛡️ Conferir habilitação do deploy AWS"\n([\s\S]*?)(?=      - name:)/g)].map(m => m[1].split('        run: |\n')[1].trim());
            assert.equal(gates.length, 3);
            assert(gates.every(g => g === gates[0]), 'Todos os jobs operacionais devem repetir a mesma barreira.');
            const script = bloco.split('        run: |\n')[1].split('\n').map(l => l.slice(10)).join('\n').trim();
            const env = { ...process.env, DEPLOY_ENABLED: 'true', GITHUB_REF: 'refs/heads/develop', DEPLOY_ENVIRONMENT: 'development', TF_ENVIRONMENT: 'dev', SSM_ENVIRONMENT_NAME: 'development' };
            const run = alteracoes => cp.spawnSync(bash, ['-e', '-c', script], { env: { ...env, ...alteracoes }, encoding: 'utf8' });
            assert.equal(run({}).status, 0);
            for (const DEPLOY_ENABLED of ['', 'false', 'TRUE', 'true ']) assert.notEqual(run({ DEPLOY_ENABLED }).status, 0);
            for (const [k,v] of [['GITHUB_REF','refs/heads/main'], ['GITHUB_REF','refs/tags/v1'], ['DEPLOY_ENVIRONMENT','production'], ['TF_ENVIRONMENT','../dev'], ['SSM_ENVIRONMENT_NAME','homologation']]) assert.notEqual(run({ [k]:v }).status, 0);
            assert(cd.includes("vars.AWS_DEPLOY_ENABLED == 'true'"));
            assert(!cd.includes('open-pr-to-release'), 'Mensageria sozinha não pode promover a aplicação.');
          });
          test('resolver real exige ação válida e alteração explícita para destroy', () => {
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'oficina-testar-acao-'));
            assert(path.resolve(dir).startsWith(path.resolve(os.tmpdir()) + path.sep));
            try {
              const git = args => cp.execFileSync('git', args, { cwd: dir, encoding: 'utf8', stdio: ['ignore','pipe','pipe'] }).trim();
              git(['init','-q']); git(['config','user.name','Teste local']); git(['config','user.email','teste@example.invalid']);
              const infra = path.join(dir, 'infra/terraform/environments/dev'); fs.mkdirSync(infra, { recursive: true });
              const control = path.join(infra, 'terraform-action.env');
              fs.writeFileSync(control, 'TERRAFORM_ACTION=destroy\n'); git(['add','.']); git(['commit','-qm','base']); const base = git(['rev-parse','HEAD']);
              const bloco = deploy.match(/      - name: "🚦 02 · Ler ação e exigir destroy dedicado"\n([\s\S]*?)(?=  prepare_and_plan:)/)[1];
              const script = bloco.split('        run: |\n')[1].split('\n').map(l => l.slice(10)).join('\n').trim();
              const executar = anterior => cp.spawnSync(bash, ['-e','-c',script], { cwd: dir, encoding: 'utf8', env: { ...process.env, TF_WORKING_DIRECTORY:'infra/terraform/environments/dev', GITHUB_BEFORE: anterior, GITHUB_SHA: git(['rev-parse','HEAD']), GITHUB_OUTPUT: path.join(dir,'output') } });
              assert.notEqual(executar(base).status, 0);
              fs.appendFileSync(control, '# destroy dedicado\n'); git(['add','.']); git(['commit','-qm','destroy dedicado']);
              assert.equal(executar(base).status, 0);
              fs.writeFileSync(control, 'TERRAFORM_ACTION=apply\n'); assert.equal(executar(base).status, 0);
              fs.writeFileSync(control, 'TERRAFORM_ACTION=outro\n'); assert.notEqual(executar(base).status, 0);
            } finally { fs.rmSync(dir, { recursive: true, force: true }); }
          });
          test('artefatos usam tentativa e commit; state parcial é preservado', () => {
            const nomes = [...deploy.matchAll(/name: (tfplan-orcamento-pagamento-[^\n]+)/g)].map(m => m[1]);
            assert.equal(nomes.length, 2); assert.equal(nomes[0], nomes[1]);
            assert(nomes.every(n => n.includes('github.run_id') && n.includes('github.run_attempt')));
            assert(deploy.includes('sha256sum -c tfplan.sha256'));
            assert(deploy.includes('source-commit.txt'));
            assert(deploy.includes("if: always() && steps.apply.outcome != 'skipped'"));
            assert(!deploy.includes('restore-keys: tfstate-'));
            assert(!deploy.includes('docker push'));
            assert(!deploy.includes('terraform destroy'));
          });

          test('plano salvo permanece vinculado a conta, região, ambiente, ação e commit', () => {
            const esperado = { conta, regiao, ambiente, acao: 'apply', commit: 'a'.repeat(40) };
            h.validarContextoPlano({ ...esperado }, esperado);
            for (const campo of Object.keys(esperado)) assert.throws(() => h.validarContextoPlano({ ...esperado, [campo]: 'divergente' }, esperado));
            assert.throws(() => h.validarContextoPlano({}, esperado));
            assert.throws(() => h.validarContextoPlano({ ...esperado, extra: 'não permitido' }, esperado));
          });

          TESTE_MENSAGERIA
          node --test "$RUNNER_TEMP/mensageria-orcamento.test.cjs"

      - name: "🎨 04 · Verificar formatação Terraform"
        run: terraform fmt -check -recursive infra/terraform

      - name: "🚀 05 · Inicializar Terraform sem backend"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -backend=false -input=false

      - name: "🔍 06 · Validar configuração Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" validate

      - name: "🧪 07 · Validar planos com providers simulados"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" test

  quality_gate:
    name: "🚦 06 · Quality gate"
    runs-on: ubuntu-latest
    needs:
      - detect_ci_scope
      - validate_git_flow
      - build_application
      - verify_code_style
      - test_application
      - build_container_image
      - validate_terraform
    if: always()

    steps:
      - name: "🚦 01 · Conferir status de todos os jobs do CI"
        run: |
          if [ "${{ needs.detect_ci_scope.result }}" != "success" ]; then
            echo "A detecção de escopo da CI falhou."
            exit 1
          fi

          if [ "${{ needs.validate_git_flow.result }}" != "success" ]; then
            echo "A validação de branches do Git Flow falhou."
            exit 1
          fi

          if [ "${{ needs.detect_ci_scope.outputs.ci_required }}" != "true" ]; then
            echo "Somente documentação ou Markdown alterados. Etapas de aplicação dispensadas."
            exit 0
          fi

          results=(
            "${{ needs.build_application.result }}"
            "${{ needs.verify_code_style.result }}"
            "${{ needs.test_application.result }}"
            "${{ needs.build_container_image.result }}"
            "${{ needs.validate_terraform.result }}"
          )

          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "Uma ou mais responsabilidades da CI falharam."
              exit 1
            fi
          done

          echo "Todas as responsabilidades da CI passaram."
