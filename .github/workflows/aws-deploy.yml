          }

          function main() {
            if (process.env.TERRAFORM_ACTION !== 'destroy')
              throw new Error('Este procedimento aceita somente destroy.');
            const dir = process.env.TF_WORKING_DIRECTORY;
            if (!dir) throw new Error('Diretório Terraform ausente.');
            const run = (cmd, args) =>
              cp.execFileSync(cmd, args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
            if (process.argv[2] === 'verify-plan') {
              verifyPlan(JSON.parse(run('terraform', [`-chdir=${dir}`, 'show', '-json', 'tfplan'])));
              console.log('Plano validado: nenhuma criação ou atualização permitida.');
              return;
            }
            if (process.argv[2] === 'verify-state') {
              const state = JSON.parse(fs.readFileSync(path.join(dir, 'terraform.tfstate'), 'utf8'));
              if ((state.resources || []).some((r) => r.mode === 'managed' && r.instances?.length)) {
                throw new Error('State ainda contém recursos gerenciados; reconciliação incompleta.');
              }
              console.log('State final sem recursos gerenciados; cache pode ser persistido.');
              return;
            }
            const identity = JSON.parse(run('aws', ['sts', 'get-caller-identity', '--output', 'json']));
            console.log(`Destroy na conta AWS ${identity.Account}.`);
            const stateFile = path.join(dir, 'terraform.tfstate');
            const state = fs.existsSync(stateFile) ? JSON.parse(fs.readFileSync(stateFile, 'utf8')) : { resources: [] };
            const config = destroyConfig(state, process.env.AWS_REGION || 'us-east-1', (cluster) => {
              try {
                run('aws', ['eks', 'describe-cluster', '--name', cluster, '--output', 'json']);
              } catch (error) {
                if (!String(error.stderr).includes('(ResourceNotFoundException)')) {
                  throw new Error('Consulta EKS falhou sem confirmar ausência; recuperação bloqueada.');
                }
                console.log('EKS comprovadamente ausente; remoção declarativa dos vínculos Kubernetes no plano.');
                return;
              }
              return false;
            });
            if (config === null) {
              console.log('EKS existente: preservada a configuração normal para destruir o workload.');
              return;
            }
            const backup = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'destroy-config-'));
            for (const name of fs.readdirSync(dir)) {
              if ((name.endsWith('.tf') || name.endsWith('.tf.json')) && name !== 'versions.tf') {
                fs.renameSync(path.join(dir, name), path.join(backup, name));
              }
            }
            fs.writeFileSync(path.join(dir, 'destroy_only.tf'), config);
            console.log('Configuração temporária exclusiva de destroy; state preservado integralmente.');
          }

          module.exports = { destroyConfig, verifyPlan };
          if (require.main === module) {
            try {
              main();
            } catch (error) {
              console.error(error.message);
              process.exit(1);
            }
          }

          PREPARAR_DESTROY

      - name: "🛡️ Conferir habilitação do deploy AWS"
        env:
          DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          TF_ENVIRONMENT: ${{ inputs.terraform_environment_directory }}
        run: |
          test "$DEPLOY_ENABLED" = true
          test "$GITHUB_REF" = refs/heads/develop
          test "$DEPLOY_ENVIRONMENT" = development
          test "$TF_ENVIRONMENT" = dev
          test "$SSM_ENVIRONMENT_NAME" = development

      - name: "🔑 02 · Configurar credenciais AWS"
        id: aws_credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "🛠️ 03 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: "📦 04 · Restaurar state da conta e ambiente"
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.enc
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup.enc
          key: tfstate-enc-v1-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-orcamento-pagamento-${{ github.run_id }}-${{ github.run_attempt }}-plan
          restore-keys: |
            tfstate-enc-v1-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-orcamento-pagamento-

      - name: "🛠️ Preparar consultas Kubernetes"
        uses: azure/setup-kubectl@v5

      - name: "🔐 Restaurar state autenticado da conta e ambiente"
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws_credentials.outputs.aws-account-id }}
        run: node "$RUNNER_TEMP/proteger-artefatos.cjs" state-open

      - name: "🛡️ 05 · Validar ownership e bootstrap do state"
        run: |
          node "$RUNNER_TEMP/mensageria-orcamento.cjs" state
          if [ ! -f "$TF_WORKING_DIRECTORY/terraform.tfstate" ]; then
            node "$RUNNER_TEMP/aplicacao-orcamento.cjs" bootstrap
          fi


      - name: "📝 Preparar composição com contratos exclusivos"
        id: prepare_vars
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER || 'oficina-mecanica-auth' }}
          JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE || 'oficina-mecanica-api' }}
          PROCESSAMENTO_REMOTO_ENABLED: ${{ vars.PROCESSAMENTO_REMOTO_ENABLED || 'false' }}
          MERCADO_PAGO_ATIVO: ${{ vars.MERCADO_PAGO_ATIVO || 'false' }}
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
          MERCADO_PAGO_RECEBEDOR_ID: ${{ vars.MERCADO_PAGO_RECEBEDOR_ID }}
          MERCADO_PAGO_URL_NOTIFICACAO: ${{ vars.MERCADO_PAGO_URL_NOTIFICACAO }}
        run: node "$RUNNER_TEMP/aplicacao-orcamento.cjs" vars

      - name: "🛡️ Preparar configuração exclusiva de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node "$RUNNER_TEMP/prepare-destroy-orcamento.cjs"

      - name: "🚀 06 · Inicializar e validar Terraform"
        run: |
          terraform -chdir="$TF_WORKING_DIRECTORY" init -input=false
          terraform -chdir="$TF_WORKING_DIRECTORY" validate

      - name: "🛡️ 07 · Conferir produtor e filas antes do destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: |
          node "$RUNNER_TEMP/mensageria-orcamento.cjs" before-destroy
          node "$RUNNER_TEMP/aplicacao-orcamento.cjs" before-destroy

      - name: "📐 08 · Gerar plano salvo"
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_ssm_environment_name: ${{ env.SSM_ENVIRONMENT_NAME }}
        run: |
          set -euo pipefail
          if [ "$TERRAFORM_ACTION" = destroy ]; then
            terraform -chdir="$TF_WORKING_DIRECTORY" plan -destroy -input=false -out=tfplan
          else
            terraform -chdir="$TF_WORKING_DIRECTORY" plan -input=false -out=tfplan
          fi
          export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          node "$RUNNER_TEMP/mensageria-orcamento.cjs" plan
          cd "$TF_WORKING_DIRECTORY"
          sha256sum tfplan > tfplan.sha256
          printf '%s' "$GITHUB_SHA" > source-commit.txt
          cd "$GITHUB_WORKSPACE"
          node "$RUNNER_TEMP/proteger-artefatos.cjs" plan-seal

      - name: "⬆️ 09 · Publicar plano desta tentativa"
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-orcamento-pagamento-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TF_WORKING_DIRECTORY }}/tfplan.bundle.enc
          if-no-files-found: error
          retention-days: 3

      - name: "🧹 Remover variáveis temporárias sensíveis"
        if: always()
        run: rm -f "$TF_WORKING_DIRECTORY/zz_ci.auto.tfvars.json"

  build_and_push_image:
    name: "🐳 03 · Publicar imagem produzida pela CI"
    needs:
      - resolve_action
      - prepare_and_plan
    if: needs.resolve_action.outputs.terraform_action == 'apply'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_IMAGE_URI: ${{ needs.prepare_and_plan.outputs.ecr_image_uri }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛡️ Conferir habilitação do deploy AWS"
        env:
          DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          TF_ENVIRONMENT: ${{ inputs.terraform_environment_directory }}
        run: |
          test "$DEPLOY_ENABLED" = true
          test "$GITHUB_REF" = refs/heads/develop
          test "$DEPLOY_ENVIRONMENT" = development
          test "$TF_ENVIRONMENT" = dev
          test "$SSM_ENVIRONMENT_NAME" = development

      - name: "🔑 02 · Configurar credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v6
        id: aws_credentials
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "🔓 03 · Login no Amazon ECR"
        uses: aws-actions/amazon-ecr-login@v2

      - name: "🔎 04 · Localizar a CI do PR que foi integrado"
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq ".[] | select(.merged_at != null and .base.ref == \"develop\" and .merge_commit_sha == \"$GITHUB_SHA\") | .number" | head -n 1)"
          test -n "$pr_number" || { echo "::error::PR integrado não encontrado."; exit 1; }
          head_sha="$(gh pr view "$pr_number" --json headRefOid --jq .headRefOid)"
          run_id="$(gh run list --workflow ci.yml --commit "$head_sha" --event pull_request --status success --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$run_id" || { echo "::error::CI aprovada não encontrada para o PR."; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: "⬇️ 05 · Baixar imagem da CI aprovada"
        uses: actions/download-artifact@v8
        with:
          name: orcamento-pagamento-image-pr-${{ steps.ci.outputs.pr_number }}
          path: ${{ runner.temp }}/ci-image
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run_id }}

      - name: "🧾 06 · Conferir se o conteúdo integrado é o validado"
        run: |
          test "$(cat "$RUNNER_TEMP/ci-image/source-tree.txt")" = "$(git rev-parse 'HEAD^{tree}')" || {
            echo "::error::O conteúdo integrado difere do validado pela CI. Deploy bloqueado."
            exit 1
          }

      - name: "📤 07 · Publicar a mesma imagem no ECR"
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/ci-image/orcamento-pagamento-image.tar
        run: |
          docker load --input "$IMAGE_ARCHIVE"
          docker tag "oficina-mecanica-orcamento-pagamento:ci" "$ECR_IMAGE_URI"
          docker push "$ECR_IMAGE_URI"

  terraform_apply:
    name: "☁️ 04 · Aplicar ou destruir infraestrutura e aplicação"
    needs: [resolve_action, prepare_and_plan, build_and_push_image]
    if: always() && needs.resolve_action.result == 'success' && needs.prepare_and_plan.result == 'success' && (needs.resolve_action.outputs.terraform_action == 'destroy' || needs.build_and_push_image.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TERRAFORM_ACTION: ${{ needs.resolve_action.outputs.terraform_action }}
      TERRAFORM_STATE_KEY: ${{ secrets.TERRAFORM_STATE_KEY }}
    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛡️ Preparar validações definidas no workflow"
        run: *validacoes_mensageria

      - name: "🧩 Preparar composição da aplicação"
        run: *validacoes_aplicacao

      - name: "🔐 Preparar proteção dos artefatos"
        run: *protecao_artefatos

      - name: "🛡️ Preparar recuperação declarativa de destroy"
        run: *recuperacao_destroy

      - name: "🛡️ Conferir habilitação do deploy AWS"
        env:
          DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          TF_ENVIRONMENT: ${{ inputs.terraform_environment_directory }}
        run: |
          test "$DEPLOY_ENABLED" = true
          test "$GITHUB_REF" = refs/heads/develop
          test "$DEPLOY_ENVIRONMENT" = development
          test "$TF_ENVIRONMENT" = dev
          test "$SSM_ENVIRONMENT_NAME" = development

      - name: "🔑 02 · Configurar credenciais AWS"
        id: aws_credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "🛠️ 03 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: "📦 04 · Restaurar state da conta e ambiente"
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.enc
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup.enc
          key: tfstate-enc-v1-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-orcamento-pagamento-${{ github.run_id }}-${{ github.run_attempt }}-final
          restore-keys: |
            tfstate-enc-v1-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-orcamento-pagamento-

      - name: "🛠️ Preparar consultas Kubernetes"
        uses: azure/setup-kubectl@v5

      - name: "🔐 Restaurar state autenticado da conta e ambiente"
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws_credentials.outputs.aws-account-id }}
        run: node "$RUNNER_TEMP/proteger-artefatos.cjs" state-open

      - name: "🛡️ 05 · Validar ownership e bootstrap do state"
        run: |
          node "$RUNNER_TEMP/mensageria-orcamento.cjs" state
          if [ ! -f "$TF_WORKING_DIRECTORY/terraform.tfstate" ]; then
            node "$RUNNER_TEMP/aplicacao-orcamento.cjs" bootstrap
          fi


      - name: "📝 Preparar recuperação do destroy sem buscar credenciais SQL"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: |
          node "$RUNNER_TEMP/aplicacao-orcamento.cjs" vars
          node "$RUNNER_TEMP/prepare-destroy-orcamento.cjs"

      - name: "🚀 06 · Inicializar Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -input=false

      - name: "⬇️ 07 · Baixar plano desta tentativa"
        uses: actions/download-artifact@v8
        with:
          name: tfplan-orcamento-pagamento-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TF_WORKING_DIRECTORY }}

      - name: "🔐 Abrir plano autenticado desta tentativa"
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws_credentials.outputs.aws-account-id }}
        run: node "$RUNNER_TEMP/proteger-artefatos.cjs" plan-open

      - name: "🛡️ 08 · Conferir plano, commit e pendências atuais"
        run: |
          set -euo pipefail
          test "$(cat "$TF_WORKING_DIRECTORY/source-commit.txt")" = "$GITHUB_SHA"
          (cd "$TF_WORKING_DIRECTORY" && sha256sum -c tfplan.sha256)
          export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          node "$RUNNER_TEMP/mensageria-orcamento.cjs" plan verify-context
          if [ "$TERRAFORM_ACTION" = destroy ]; then
            node "$RUNNER_TEMP/mensageria-orcamento.cjs" before-destroy
            node "$RUNNER_TEMP/aplicacao-orcamento.cjs" before-destroy
          fi

      - name: "🚦 Invalidar disponibilidade anterior do workload"
        if: env.TERRAFORM_ACTION == 'apply'
        run: node "$RUNNER_TEMP/aplicacao-orcamento.cjs" invalidate

      - name: "✅ 09 · Aplicar exclusivamente o plano salvo"
        id: apply
        run: terraform -chdir="$TF_WORKING_DIRECTORY" apply -input=false -auto-approve tfplan

      - name: "🔐 Proteger state final, inclusive após falha parcial"
        id: proteger_state
        if: always() && steps.apply.outcome != 'skipped' && steps.apply.outcome != ''
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws_credentials.outputs.aws-account-id }}
        run: node "$RUNNER_TEMP/proteger-artefatos.cjs" state-seal

      - name: "💾 10 · Preservar state final, inclusive após falha parcial"
        if: always() && steps.proteger_state.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.enc
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup.enc
          key: tfstate-enc-v1-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-orcamento-pagamento-${{ github.run_id }}-${{ github.run_attempt }}-final

      - name: "🔎 11 · Validar recursos reais e contratos após apply"
        if: env.TERRAFORM_ACTION == 'apply'
        run: node "$RUNNER_TEMP/mensageria-orcamento.cjs" after-apply

      - name: "🔎 11 · Validar state vazio e ausência real após destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: |
          node "$RUNNER_TEMP/mensageria-orcamento.cjs" after-destroy
          node "$RUNNER_TEMP/aplicacao-orcamento.cjs" after-destroy

  rollout_check:
    name: "☸️ 05 · Validar rollout da aplicação no EKS"
    needs: [resolve_action, prepare_and_plan, terraform_apply]
    if: needs.resolve_action.outputs.terraform_action == 'apply' && needs.terraform_apply.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EKS_CLUSTER_NAME: ${{ needs.prepare_and_plan.outputs.eks_cluster_name }}
      ECR_IMAGE_URI: ${{ needs.prepare_and_plan.outputs.ecr_image_uri }}
    steps:
      - name: "🛡️ Conferir habilitação do deploy AWS"
        env:
          DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          TF_ENVIRONMENT: ${{ inputs.terraform_environment_directory }}
        run: |
          test "$DEPLOY_ENABLED" = true
          test "$GITHUB_REF" = refs/heads/develop
          test "$DEPLOY_ENVIRONMENT" = development
          test "$TF_ENVIRONMENT" = dev
          test "$SSM_ENVIRONMENT_NAME" = development

      - name: "🔑 01 · Configurar credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "🛠️ 02 · Instalar kubectl"
        uses: azure/setup-kubectl@v5

      - name: "🔗 03 · Configurar kubeconfig do EKS"
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" --kubeconfig "$RUNNER_TEMP/rollout.kubeconfig"

      - name: "⏳ 04 · Conferir rollout, imagem e Service próprios"
        env:
          KUBECONFIG: ${{ runner.temp }}/rollout.kubeconfig
        run: |
          set -euo pipefail
          namespace=oficina-mecanica-orcamento-pagamento
          kubectl rollout status deployment/oficina-mecanica-orcamento-pagamento -n "$namespace" --timeout=600s
          test "$(kubectl get deployment oficina-mecanica-orcamento-pagamento -n "$namespace" -o jsonpath='{.spec.template.spec.containers[0].image}')" = "$ECR_IMAGE_URI"
          test "$(kubectl get service oficina-mecanica-orcamento-pagamento -n "$namespace" -o jsonpath='{.spec.type}')" = NodePort
          test "$(kubectl get service oficina-mecanica-orcamento-pagamento -n "$namespace" -o jsonpath='{.spec.ports[0].nodePort}')" = 30082
          kubectl get hpa oficina-mecanica-orcamento-pagamento-hpa -n "$namespace"
          kubectl get pods -n "$namespace" -o wide

      - name: "🩺 05 · Validar health privado antes de liberar disponibilidade"
        env:
          KUBECONFIG: ${{ runner.temp }}/rollout.kubeconfig
        run: |
          set -euo pipefail
          kubectl port-forward -n oficina-mecanica-orcamento-pagamento service/oficina-mecanica-orcamento-pagamento 18082:80 >/dev/null 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          curl --silent --fail --max-time 5 --retry 15 --retry-delay 2 --retry-all-errors --output /dev/null http://127.0.0.1:18082/api/health
          aws ssm put-parameter --name /oficina-mecanica/development/status/orcamento-pagamento-aplicacao --type String --value ready --overwrite >/dev/null
          test "$(aws ssm get-parameter --name /oficina-mecanica/development/status/orcamento-pagamento-aplicacao --query Parameter.Value --output text)" = ready

      - name: "🧹 06 · Remover kubeconfig temporário"
        if: always()
        run: rm -f "$RUNNER_TEMP/rollout.kubeconfig"
